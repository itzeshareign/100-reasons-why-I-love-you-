        <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Reasons Why I Love You</title>
<style>
body { background:#ffe6f0; font-family:'Poppins', sans-serif; text-align:center; margin:0; padding:20px; overflow-x:hidden; }
.envelope { font-size:100px; cursor:pointer; margin-top:50px; transition: transform 0.3s; }
.envelope:hover { transform: scale(1.1); }
.hidden { display:none; }
#mainContent { animation: fadeIn 1s ease-in; }
h1 { color:#d63384; }
.subtitle { color:#555; margin-bottom:20px; }
.song { margin:20px auto; max-width:400px; }
.reason { background:white; margin:10px auto; padding:15px; border-radius:15px; max-width:420px; box-shadow:0 4px 8px rgba(0,0,0,0.1); text-align:left; opacity:0; transform: translateY(20px); animation: slideUp 0.5s forwards; }
.reason-num { font-weight:bold; color:#d63384; margin-right:8px; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
@keyframes slideUp { to {opacity:1; transform: translateY(0);} }
.heart { position: fixed; font-size: 20px; color: #ff4d6d; animation: float 4s linear infinite; }
@keyframes float { 0% {transform: translateY(0) scale(1); opacity:1;} 100% {transform: translateY(-100vh) scale(0.5); opacity:0;} }
</style>
</head>
<body>

<div id="letter">
  <div class="envelope" onclick="openLetter()">💌</div>
  <p>Click the envelope to open 💖</p>
</div>

<div id="mainContent" class="hidden">
  <h1>100 Reasons Why I Love You</h1>
  <p class="subtitle">For you 💖</p>
  
  <p style="color:#d63384; font-weight:bold;">Our Song 🎵 - Statue by Lil Eddie</p>
  <div class="song">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/5II8XNTmGAsegdcYFplDfN?utm_source=generator&t=120" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <div id="reasons"></div>
</div>

<script>
const reasons = [
"your smile", "your laugh", "your eyes", "your voice", "your hair", "your random yap", "your weird side", "your hands", "your kindness", "your brain",
"you listen to me", "you remember little things about me", "you care if i ate", "you make me feel safe", "you make me feel seen", "you choose me everyday", "you're patient with me", "you cheer me up", "you believe in me", "you support my dreams",
"we laugh together", "we're comfortable in silence", "we match energy", "we understand each other", "we grow together", "you're my favorite person to talk to", "you're my favorite notification", "you're my safe place", "you're my home", "you're my favorite 'what if' that came true",
"the way you say my name", "the way you ask 'kumain ka na?'", "the way you worry about me", "the way you get jealous - it's cute", "the way you get soft when you're tired", "the way you try even when it's hard", "the way you don't give up on us", "the way you look at me", "the way you protect me", "the way you choose to stay",
"you're my comfort zone", "you're my good morning", "you're my good night", "you're my playlist", "you're my comfort food", "you're my unwind", "you're my peace", "you're my chaos in a good way", "you're my adventure", "you're my favorite habit",
"i can see us growing old", "i want all my firsts with you", "i want to travel with you", "i want to cook with you", "i want to build with you", "i want to fail and win with you", "i want your family to be my family", "i want to meet our future kids", "i want to be your person", "i want you to be my person",
"because of you i laugh more", "because of you i smile more", "because of you i'm braver", "because of you i'm softer", "because of you i'm better", "because of you i'm not alone", "because of you i have hope", "because of you i have someone", "because of you i have you", "because of you i'm loved",
"you don't leave even when i'm makulit", "you stay even when i'm makunsumami", "you explain even when i ask 10x", "you forgive me so fast", "you understand even when i can't explain", "you're real, no plastic", "you're loyal", "you're funny", "you're sweet when you want to be", "you're strong",
"because you feel like home", "because with you, i'm me", "because you don't judge me", "because you hold my hand on hard days", "because you make ordinary days special", "because you're worth it", "because i choose you", "because my heart picked you", "because i can't imagine life without you", "because i love you",
"because i really love you", "because i love the way you love me", "because you're mine", "because i'm yours", "because us", "because always", "because forever", "because it's you", "because it will always be you", "because i love you 100x more than this list"
];

function openLetter(){
  document.getElementById('letter').style.display='none';
  document.getElementById('mainContent').classList.remove('hidden');
  const container = document.getElementById('reasons');
  reasons.forEach((r,i)=>{
    setTimeout(()=>{
      const div = document.createElement('div');
      div.className = 'reason';
      div.style.animationDelay = `${i*0.1}s`;
      div.innerHTML = `<span class="reason-num">${i+1}.</span> ${r}`;
      container.appendChild(div);
    }, i*200);
  });
  setInterval(createHeart, 300);
}

function createHeart(){
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerHTML = '❤️';
  heart.style.left = Math.random()*100 + 'vw';
  heart.style.top = '100vh';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(), 4000);
}
</script>

</body>
</html>
